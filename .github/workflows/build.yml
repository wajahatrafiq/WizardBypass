name: Build WizardBypass (Fixed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check environment
      run: |
        echo "🔍 CHECKING BUILD ENVIRONMENT..."
        echo "Working directory: $(pwd)"
        echo "Available files:"
        ls -la
        echo "SDK path:"
        xcrun --sdk iphoneos --show-sdk-path
        echo "Clang version:"
        clang --version

    - name: Create simple WizardBypass source
      run: |
        echo "📝 CREATING SIMPLE WIZARDBYPASS SOURCE..."
        
        cat > simple_wizard.m << 'EOF'
#import <Foundation/Foundation.h>
#import <UIKit/UIKit.h>
#import <objc/runtime.h>

static BOOL initialized = NO;

__attribute__((constructor))
static void init() {
    dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
        NSLog(@"[Wizard] 🚀 BYPASS INITIALIZED");
        
        // Block SCLAlertView
        Class sclClass = objc_getClass("SCLAlertView");
        if (sclClass) {
            NSLog(@"[Wizard] ✅ SCLAlertView FOUND");
            
            SEL showSelector = sel_registerName("showInfo");
            Method showMethod = class_getInstanceMethod(sclClass, showSelector);
            if (showMethod) {
                method_setImplementation(showMethod, imp_implementationWithBlock(^{
                    NSLog(@"[Wizard] 🚫 POPUP BLOCKED");
                    return nil;
                }));
                NSLog(@"[Wizard] ✅ METHOD BLOCKED");
            }
        }
        
        // Create floating button
        UIWindow *window = [UIApplication sharedApplication].keyWindow;
        if (window && !initialized) {
            UIButton *btn = [UIButton buttonWithType:UIButtonTypeCustom];
            btn.frame = CGRectMake(50, 100, 60, 60);
            btn.backgroundColor = [UIColor purpleColor];
            btn.layer.cornerRadius = 30;
            [btn setTitle:@"W" forState:UIControlStateNormal];
            [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
            
            [btn addTarget:btn action:@selector(showMenu) forControlEvents:UIControlEventTouchUpInside];
            
            class_addMethod([btn class], @selector(showMenu), imp_implementationWithBlock(^{
                UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"WizardBypass" 
                                                                               message:@"Bypass is active!" 
                                                                        preferredStyle:UIAlertControllerStyleAlert];
                [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                
                UIViewController *rootVC = window.rootViewController;
                if (rootVC) {
                    [rootVC presentViewController:alert animated:YES completion:nil];
                }
            }), "v@:");
            
            [window addSubview:btn];
            initialized = YES;
            NSLog(@"[Wizard] ✅ BUTTON CREATED");
        }
    });
}
EOF
        
        echo "✅ Source file created"
        ls -la simple_wizard.m

    - name: Compile with clang
      run: |
        echo "🔨 COMPILING WITH CLANG..."
        
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK: $SDK_PATH"
        
        clang \
          -arch arm64 \
          -isysroot "$SDK_PATH" \
          -miphoneos-version-min=13.0 \
          -framework Foundation \
          -framework UIKit \
          -dynamiclib \
          -o WizardBypass.dylib \
          simple_wizard.m
        
        echo "📊 COMPILATION RESULTS:"
        ls -lh WizardBypass.dylib
        file WizardBypass.dylib

    - name: Verify dylib
      run: |
        echo "🔍 VERIFYING DYLIB..."
        
        if [ ! -f "WizardBypass.dylib" ]; then
          echo "❌ ERROR: dylib not found"
          exit 1
        fi
        
        if ! file WizardBypass.dylib | grep "arm64"; then
          echo "❌ ERROR: wrong architecture"
          exit 1
        fi
        
        echo "📋 DEPENDENCIES:"
        otool -L WizardBypass.dylib
        
        echo "✅ DYLIB VERIFICATION PASSED"

    - name: Create package
      run: |
        echo "📦 CREATING DEPLOYMENT PACKAGE..."
        
        mkdir -p deployment
        cp WizardBypass.dylib deployment/
        
        cat > deployment/README.md << 'EOF'
# WizardBypass Deployment

## Files:
- WizardBypass.dylib - Compiled bypass library

## Installation:
1. Inject dylib into 8 Ball Pool
2. Launch game
3. Look for purple "W" button
4. Tap button to verify

## Features:
- Authentication popup blocking
- Floating access button
- Menu system
EOF
        
        ls -la deployment/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WizardBypass-Fixed
        path: deployment/
